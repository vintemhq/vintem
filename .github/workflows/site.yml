name: Site de docs

# Só confere o build. Quem publica em https://vintem.dev é o Workers Builds da
# Cloudflare (docs/site/wrangler.jsonc), com preview por branch.
on:
  pull_request:
    paths: ["docs/**", "api/openapi.yaml", "deploy/compose/**", "CONTRIBUTING.md", ".github/workflows/site.yml"]
  push:
    branches: [develop]
    paths: ["docs/**", "api/openapi.yaml", "deploy/compose/**", "CONTRIBUTING.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # O cache do GitHub Actions às vezes trava, e o padrão é esperar 10 minutos
  # por segmento (#180). Com 2, o cache desiste e o job segue sem ele: baixar as
  # dependências de novo leva segundos.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npm run build
